services:
  # Backend API
  - type: web
    name: aibookcomposer
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aibookcomposer-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"

  # Frontend Static Site
  - type: web
    name: aibookcomposer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://aibookcomposer.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Database
  - type: pgsql
    name: aibookcomposer-db
    plan: free
    databaseName: bookcomposer
    user: bookcomposer
